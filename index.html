<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>左右來車防撞遊戲 - Traffic Lane Defender</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      background: #10130f;
    }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f8fafc;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .app-shell {
      width: 100%;
      max-width: 1160px;
      height: 100dvh;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
    }

    .game-frame {
      position: relative;
      width: 100%;
      flex: 1 1 auto;
      min-height: 420px;
      overflow: hidden;
      border-radius: 8px;
      background: #20241f;
      border: 1px solid rgba(74, 222, 128, 0.28);
      box-shadow: 0 22px 54px rgba(0, 0, 0, 0.42);
    }

    .hud-chip {
      border-radius: 999px;
      background: rgba(8, 10, 8, 0.72);
      border: 1px solid rgba(248, 250, 252, 0.14);
      backdrop-filter: blur(8px);
    }

    .modal-panel {
      border-radius: 8px;
      background: rgba(22, 27, 22, 0.94);
      border: 1px solid rgba(226, 232, 240, 0.12);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.44);
    }

    @media (max-width: 640px) {
      .app-shell {
        padding: 8px;
        gap: 8px;
      }

      .game-frame {
        min-height: 0;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="flex items-center justify-between gap-2 shrink-0">
      <div class="min-w-0">
        <h1 class="text-lg sm:text-2xl font-bold leading-tight truncate">左右來車防撞遊戲</h1>
        <p class="text-[11px] sm:text-sm text-emerald-100/75 leading-tight">Traffic Lane Defender</p>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <div class="hidden sm:block text-right text-xs text-amber-100/85">
          最高分 <span id="bestScoreHeader" class="font-mono font-bold text-amber-300">0</span>
        </div>
        <button id="muteBtn"
          class="text-xs sm:text-sm px-3 py-1.5 rounded-full border border-emerald-300/30 bg-emerald-950/70 hover:bg-emerald-900 transition">
          🔊 聲音：開啟
        </button>
      </div>
    </header>

    <section id="gameFrame" class="game-frame">
      <canvas id="gameCanvas"></canvas>

      <div class="absolute top-2 left-2 right-2 flex items-start justify-between gap-2 pointer-events-none">
        <div class="hud-chip px-3 py-1 text-[11px] sm:text-sm">
          分數 <span id="scoreLabel" class="font-mono font-bold text-emerald-300">0</span>
        </div>
        <div class="hud-chip px-3 py-1 text-[11px] sm:text-sm text-center">
          <span id="stageLabel" class="text-cyan-200">入門</span>
        </div>
        <div class="hud-chip px-3 py-1 text-[11px] sm:text-sm text-right">
          Combo <span id="comboLabel" class="font-mono font-bold text-amber-300">0</span>
        </div>
      </div>

      <div class="absolute bottom-2 left-2 right-2 flex items-end justify-between gap-2 pointer-events-none">
        <div class="hud-chip px-3 py-1 text-[10px] sm:text-xs text-slate-200/90">
          擦身 <span id="nearMissLabel" class="font-mono text-orange-300">0</span>
        </div>
        <div class="hud-chip px-3 py-1 text-[10px] sm:text-xs text-slate-200/90 sm:hidden">
          最高分 <span id="bestScoreMobile" class="font-mono text-amber-300">0</span>
        </div>
      </div>

      <button id="endGameBtn"
              type="button"
              class="hidden absolute top-12 right-2 z-10 inline-flex items-center gap-1.5 rounded-lg border border-red-300/35 bg-red-950/75 px-3 py-1.5 text-[11px] sm:text-sm font-semibold text-red-100 shadow-lg shadow-black/25 backdrop-blur-sm transition hover:bg-red-900/90">
        <span aria-hidden="true" class="text-red-200 leading-none">■</span>
        <span>結束</span>
      </button>

      <div id="menuOverlay"
           class="absolute inset-0 flex flex-col items-center justify-center bg-black/64 backdrop-blur-sm px-3">
        <div class="modal-panel px-4 sm:px-6 py-4 sm:py-6 w-full max-w-sm">
          <div class="text-center mb-4">
            <div class="text-lg sm:text-xl font-bold mb-1">🚦 遊戲開始設定</div>
            <div class="text-xs sm:text-sm text-slate-300 leading-relaxed">
              觀察邊緣預警，拖曳車子或用方向鍵換道，讓車流安全通過。
            </div>
          </div>

          <div class="mb-4">
            <div class="flex justify-between items-center mb-1.5 text-xs sm:text-sm">
              <span>車速難度</span>
              <span id="speedDisplay" class="font-mono text-emerald-300">1.0x</span>
            </div>
            <input id="speedSlider" type="range" min="0.5" max="1.5" step="0.1"
                   class="w-full accent-emerald-400"
                   value="1.0" />
            <div class="flex justify-between text-[10px] sm:text-xs text-slate-400 mt-1">
              <span>0.5x 慢速</span>
              <span>1.5x 挑戰</span>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2 text-[11px] sm:text-xs text-slate-300 mb-4">
            <div class="rounded-lg bg-white/5 px-3 py-2">滑鼠/觸控：拖曳換道</div>
            <div class="rounded-lg bg-white/5 px-3 py-2">鍵盤：↑↓ 或 W/S</div>
            <div class="rounded-lg bg-white/5 px-3 py-2">Tab：切換選車</div>
            <div class="rounded-lg bg-white/5 px-3 py-2">F：全螢幕</div>
            <div class="rounded-lg bg-white/5 px-3 py-2">結束：右上角按鈕</div>
          </div>

          <button id="startBtn"
                  class="w-full py-2.5 rounded-lg bg-emerald-400 hover:bg-emerald-300 text-slate-950 font-semibold text-sm sm:text-base transition">
            ▶️ 開始遊戲
          </button>
        </div>
      </div>

      <div id="gameOverOverlay"
           class="absolute inset-0 hidden flex flex-col items-center justify-center bg-black/66 backdrop-blur-sm px-3">
        <div class="modal-panel px-4 sm:px-6 py-4 sm:py-6 w-full max-w-sm text-center">
          <div id="gameOverTitle" class="text-xl sm:text-2xl font-extrabold mb-1 text-red-300 drop-shadow">
            💥 撞車了！
          </div>
          <div id="gameOverMessage" class="text-xs sm:text-sm text-slate-200 mb-3">
            小小交管員辛苦了，再挑戰一次吧。
          </div>
          <div class="grid grid-cols-3 gap-2 text-xs sm:text-sm mb-4">
            <div class="rounded-lg bg-white/5 px-2 py-2">
              <div class="text-slate-400">分數</div>
              <div id="finalScore" class="font-mono font-bold text-emerald-300 text-base">0</div>
            </div>
            <div class="rounded-lg bg-white/5 px-2 py-2">
              <div class="text-slate-400">最高</div>
              <div id="finalBestScore" class="font-mono font-bold text-amber-300 text-base">0</div>
            </div>
            <div class="rounded-lg bg-white/5 px-2 py-2">
              <div class="text-slate-400">擦身</div>
              <div id="finalNearMiss" class="font-mono font-bold text-orange-300 text-base">0</div>
            </div>
          </div>
          <button id="restartBtn"
                  class="w-full py-2.5 rounded-lg bg-emerald-400 hover:bg-emerald-300 text-slate-950 font-semibold text-sm sm:text-base transition mb-2">
            🔁 再玩一次
          </button>
          <button id="backToMenuBtn"
                  class="w-full py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-100 text-xs sm:text-sm transition">
            ⬅️ 回到速度設定選單
          </button>
        </div>
      </div>
    </section>

    <footer class="text-[10px] sm:text-xs text-slate-300/80 text-center leading-relaxed shrink-0">
      邊緣紅色箭頭代表即將來車。先點選車子，再用 ↑↓ / W/S 換道；擦身而過與連續安全通過會加分。
    </footer>
  </main>

  <script>
    'use strict';

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gameFrame = document.getElementById('gameFrame');

    const scoreLabel = document.getElementById('scoreLabel');
    const comboLabel = document.getElementById('comboLabel');
    const nearMissLabel = document.getElementById('nearMissLabel');
    const stageLabel = document.getElementById('stageLabel');
    const bestScoreHeader = document.getElementById('bestScoreHeader');
    const bestScoreMobile = document.getElementById('bestScoreMobile');
    const finalScoreLabel = document.getElementById('finalScore');
    const finalBestScoreLabel = document.getElementById('finalBestScore');
    const finalNearMissLabel = document.getElementById('finalNearMiss');
    const menuOverlay = document.getElementById('menuOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const gameOverTitle = document.getElementById('gameOverTitle');
    const gameOverMessage = document.getElementById('gameOverMessage');
    const speedSlider = document.getElementById('speedSlider');
    const speedDisplay = document.getElementById('speedDisplay');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const backToMenuBtn = document.getElementById('backToMenuBtn');
    const muteBtn = document.getElementById('muteBtn');
    const endGameBtn = document.getElementById('endGameBtn');

    const LANES = 3;
    const STORAGE_KEY = 'trafficLaneDefenderBestScore';
    const VEHICLE_FRAME_WIDTH = 786;
    const VEHICLE_FRAME_HEIGHT = 321;
    const VEHICLE_FRAME_COUNT = 4;
    const VEHICLE_FRAME_BOB = [0, -1, 0, 1];
    const VEHICLE_SPRITES = [
      { name: 'red-sedan', row: 0, vehicleClass: 'car', aspect: 3.4803, sourceWidth: 529, sourceHeight: 152, speedBias: 1.08 },
      { name: 'yellow-taxi', row: 1, vehicleClass: 'car', aspect: 3.1852, sourceWidth: 516, sourceHeight: 162, speedBias: 1.02 },
      { name: 'blue-bus', row: 2, vehicleClass: 'large', aspect: 4.0216, sourceWidth: 744, sourceHeight: 185, speedBias: 0.84 },
      { name: 'orange-van', row: 3, vehicleClass: 'van', aspect: 2.7818, sourceWidth: 459, sourceHeight: 165, speedBias: 0.94 },
      { name: 'purple-hatchback', row: 4, vehicleClass: 'car', aspect: 3.0738, sourceWidth: 458, sourceHeight: 149, speedBias: 1.12 },
      { name: 'dump-truck', row: 5, vehicleClass: 'heavy', aspect: 2.4296, sourceWidth: 656, sourceHeight: 270, speedBias: 0.78 },
      { name: 'cement-mixer', row: 6, vehicleClass: 'heavy', aspect: 2.2456, sourceWidth: 640, sourceHeight: 285, speedBias: 0.74 },
      { name: 'tow-truck', row: 7, vehicleClass: 'service', aspect: 2.2857, sourceWidth: 624, sourceHeight: 273, speedBias: 0.82 },
      { name: 'road-roller', row: 8, vehicleClass: 'heavy', aspect: 1.987, sourceWidth: 457, sourceHeight: 230, speedBias: 0.68 },
      { name: 'mobile-crane', row: 9, vehicleClass: 'heavy', aspect: 2.821, sourceWidth: 725, sourceHeight: 257, speedBias: 0.66 }
    ];
    const vehicleSpriteImage = new Image();
    let vehicleSpriteReady = false;
    vehicleSpriteImage.onload = function () {
      vehicleSpriteReady = true;
      render();
    };
    vehicleSpriteImage.src = 'assets/cars/vehicle-sprites.png';

    let viewWidth = 0;
    let viewHeight = 0;
    let laneHeight = 0;
    let laneCenters = [];
    let laneTops = [];

    let gameState = 'menu';
    let lastTime = 0;
    let gameTime = 0;
    let cars = [];
    let particles = [];
    let spawnWarnings = [];
    let floatingTexts = [];
    let nearMissPairs = new Set();
    let spawnTimer = 0;
    let spawnInterval = 1.2;
    let spawnLeadTime = 0.85;
    let maxCars = 5;
    let maxActiveConflicts = 1;
    let minSpawnReactionTime = 5.0;
    let nextCarId = 1;
    let score = 0;
    let combo = 0;
    let comboMultiplier = 1;
    let nearMissCount = 0;
    let bestScore = readBestScore();
    let baseSpeedMultiplier = 1.0;
    let difficultyScale = 1.0;
    let currentStage = '入門';
    let screenShakeTime = 0;
    let screenShakeIntensity = 0;
    let selectedCar = null;
    let gameEndReason = null;

    let audioCtx = null;
    let audioEnabled = true;

    function readBestScore() {
      try {
        return Number(window.localStorage.getItem(STORAGE_KEY)) || 0;
      } catch (error) {
        return 0;
      }
    }

    function writeBestScore(value) {
      try {
        window.localStorage.setItem(STORAGE_KEY, String(value));
      } catch (error) {
        // Local storage can be unavailable in strict privacy contexts.
      }
    }

    function updateHud() {
      scoreLabel.textContent = String(score);
      comboLabel.textContent = combo > 0 ? `${combo} / x${comboMultiplier}` : '0';
      nearMissLabel.textContent = String(nearMissCount);
      bestScoreHeader.textContent = String(bestScore);
      bestScoreMobile.textContent = String(bestScore);
      stageLabel.textContent = currentStage;
    }

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;

      viewWidth = Math.max(1, rect.width);
      viewHeight = Math.max(1, rect.height);
      canvas.width = Math.floor(viewWidth * dpr);
      canvas.height = Math.floor(viewHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      laneHeight = viewHeight / LANES;
      laneCenters = [];
      laneTops = [];
      for (let i = 0; i < LANES; i++) {
        laneTops.push(laneHeight * i);
        laneCenters.push(laneHeight * (i + 0.5));
      }

      cars.forEach(car => {
        car.resize();
        car.y = laneCenters[car.laneIndex];
        car.startY = car.y;
        car.targetY = car.y;
      });
      render();
    }

    window.addEventListener('resize', resizeCanvas);
    document.addEventListener('fullscreenchange', resizeCanvas);
    if ('ResizeObserver' in window) {
      new ResizeObserver(resizeCanvas).observe(gameFrame);
    }

    function ensureAudioContext() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          audioCtx = new AudioContext();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function createAudioOutput(pan = 0, volume = 0.78) {
      const output = audioCtx.createGain();
      output.gain.value = volume;

      if (audioCtx.createStereoPanner) {
        const panner = audioCtx.createStereoPanner();
        panner.pan.setValueAtTime(clamp(pan, -1, 1), audioCtx.currentTime);
        output.connect(panner).connect(audioCtx.destination);
      } else {
        output.connect(audioCtx.destination);
      }

      return output;
    }

    function releaseAudioOutput(output, delayMs = 700) {
      window.setTimeout(() => {
        try {
          output.disconnect();
        } catch (error) {
          // The node may already be disconnected by the browser.
        }
      }, delayMs);
    }

    function scheduleTone(output, type, startFreq, endFreq, startTime, duration, peakGain) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const attack = Math.min(0.018, duration * 0.32);

      osc.type = type;
      osc.frequency.setValueAtTime(Math.max(1, startFreq), startTime);
      if (endFreq && endFreq !== startFreq) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(1, endFreq), startTime + duration);
      }

      gain.gain.setValueAtTime(0.0001, startTime);
      gain.gain.linearRampToValueAtTime(peakGain, startTime + attack);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

      osc.connect(gain).connect(output);
      osc.start(startTime);
      osc.stop(startTime + duration + 0.02);
    }

    function scheduleNoiseBurst(output, startTime, duration, peakGain, filterFreq = 720, filterType = 'lowpass') {
      const bufferSize = Math.max(1, Math.floor(audioCtx.sampleRate * duration));
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
      }

      const noise = audioCtx.createBufferSource();
      const filter = audioCtx.createBiquadFilter();
      const gain = audioCtx.createGain();

      noise.buffer = buffer;
      filter.type = filterType;
      filter.frequency.setValueAtTime(filterFreq, startTime);
      gain.gain.setValueAtTime(0.0001, startTime);
      gain.gain.linearRampToValueAtTime(peakGain, startTime + Math.min(0.012, duration * 0.35));
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

      noise.connect(filter).connect(gain).connect(output);
      noise.start(startTime);
      noise.stop(startTime + duration + 0.02);
    }

    function playVehicleSpawnSound(sprite, direction) {
      if (!audioEnabled) return;
      ensureAudioContext();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      const pan = direction > 0 ? -0.72 : 0.72;
      const output = createAudioOutput(pan, 0.74);
      const name = sprite.name;
      const finish = (delayMs = 620) => releaseAudioOutput(output, delayMs);

      if (name === 'yellow-taxi') {
        scheduleTone(output, 'square', 820, 820, now, 0.08, 0.1);
        scheduleTone(output, 'square', 1100, 1100, now + 0.09, 0.08, 0.08);
        scheduleTone(output, 'triangle', 360, 520, now, 0.2, 0.07);
        finish(420);
        return;
      }

      if (name === 'blue-bus') {
        scheduleTone(output, 'sine', 196, 174, now, 0.34, 0.18);
        scheduleTone(output, 'triangle', 98, 92, now, 0.38, 0.09);
        scheduleNoiseBurst(output, now, 0.12, 0.035, 260);
        finish(620);
        return;
      }

      if (name === 'tow-truck') {
        scheduleTone(output, 'square', 580, 580, now, 0.08, 0.08);
        scheduleTone(output, 'square', 760, 760, now + 0.1, 0.08, 0.075);
        scheduleTone(output, 'sawtooth', 155, 120, now, 0.24, 0.08);
        finish(480);
        return;
      }

      if (name === 'road-roller') {
        scheduleTone(output, 'sawtooth', 76, 58, now, 0.36, 0.16);
        scheduleTone(output, 'triangle', 112, 92, now + 0.04, 0.28, 0.08);
        scheduleNoiseBurst(output, now, 0.28, 0.11, 180);
        finish(650);
        return;
      }

      if (name === 'mobile-crane') {
        scheduleTone(output, 'sawtooth', 92, 70, now, 0.32, 0.13);
        scheduleTone(output, 'square', 680, 680, now + 0.06, 0.06, 0.055);
        scheduleTone(output, 'square', 840, 840, now + 0.16, 0.06, 0.05);
        scheduleNoiseBurst(output, now, 0.2, 0.08, 260);
        finish(560);
        return;
      }

      if (name === 'cement-mixer') {
        scheduleTone(output, 'sawtooth', 88, 66, now, 0.31, 0.13);
        scheduleTone(output, 'triangle', 150, 118, now + 0.03, 0.34, 0.08);
        scheduleNoiseBurst(output, now, 0.24, 0.08, 230);
        finish(620);
        return;
      }

      if (name === 'dump-truck') {
        scheduleTone(output, 'sawtooth', 104, 78, now, 0.3, 0.15);
        scheduleNoiseBurst(output, now, 0.22, 0.095, 240);
        finish(560);
        return;
      }

      if (sprite.vehicleClass === 'van') {
        scheduleTone(output, 'sawtooth', 280, 230, now, 0.22, 0.11);
        scheduleTone(output, 'triangle', 420, 520, now + 0.04, 0.14, 0.05);
        finish(420);
        return;
      }

      scheduleTone(output, 'triangle', 520, 760, now, 0.16, 0.09);
      scheduleTone(output, 'sawtooth', 300, 240, now, 0.18, 0.055);
      scheduleNoiseBurst(output, now, 0.08, 0.035, 1200, 'highpass');
      finish(380);
    }

    function playManualEndSound() {
      if (!audioEnabled) return;
      ensureAudioContext();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      const output = createAudioOutput(0, 0.68);
      scheduleTone(output, 'triangle', 420, 280, now, 0.16, 0.1);
      scheduleTone(output, 'sine', 260, 196, now + 0.11, 0.18, 0.075);
      releaseAudioOutput(output, 480);
    }

    function playSwipeSound() {
      if (!audioEnabled) return;
      ensureAudioContext();
      if (!audioCtx) return;

      const duration = 0.12;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(320, audioCtx.currentTime + duration);

      gain.gain.setValueAtTime(0.0, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playPassSound() {
      if (!audioEnabled) return;
      ensureAudioContext();
      if (!audioCtx) return;

      const duration = 0.14;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(560, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(920 + comboMultiplier * 60, audioCtx.currentTime + duration);

      gain.gain.setValueAtTime(0.0, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.24, audioCtx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playNearMissSound() {
      if (!audioEnabled) return;
      ensureAudioContext();
      if (!audioCtx) return;

      const duration = 0.08;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'square';
      osc.frequency.setValueAtTime(920, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1260, audioCtx.currentTime + duration);

      gain.gain.setValueAtTime(0.0, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.16, audioCtx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playCrashSound() {
      if (!audioEnabled) return;
      ensureAudioContext();
      if (!audioCtx) return;

      const duration = 0.42;
      const bufferSize = audioCtx.sampleRate * duration;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const gain = audioCtx.createGain();

      gain.gain.setValueAtTime(0.62, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

      noise.connect(gain).connect(audioCtx.destination);
      noise.start();
      noise.stop(audioCtx.currentTime + duration);
    }

    muteBtn.addEventListener('click', function () {
      audioEnabled = !audioEnabled;
      if (audioEnabled) {
        muteBtn.textContent = '🔊 聲音：開啟';
        ensureAudioContext();
      } else {
        muteBtn.textContent = '🔇 聲音：關閉';
      }
    });

    function pickVehicleSprite() {
      return VEHICLE_SPRITES[Math.floor(Math.random() * VEHICLE_SPRITES.length)];
    }

    function getVehicleRenderSize(sprite) {
      const isHeavy = sprite.vehicleClass === 'heavy';
      const isLarge = sprite.vehicleClass === 'large';
      const isService = sprite.vehicleClass === 'service';
      const isVan = sprite.vehicleClass === 'van';
      const laneScale = isHeavy ? 0.27 : (isLarge ? 0.26 : (isService || isVan ? 0.25 : 0.23));
      const minHeight = isHeavy || isLarge ? 34 : 30;
      const maxHeight = isHeavy ? 58 : (isLarge ? 54 : (isService || isVan ? 50 : 46));
      const maxWidth = Math.min(viewWidth * 0.46, isHeavy || isLarge ? 270 : 220);
      let nextHeight = clamp(laneHeight * laneScale, minHeight, maxHeight);
      let nextWidth = nextHeight * sprite.aspect;

      if (nextWidth > maxWidth) {
        nextWidth = maxWidth;
        nextHeight = nextWidth / sprite.aspect;
      }

      return { width: nextWidth, height: nextHeight };
    }

    class Car {
      constructor(laneIndex, direction, sprite = null) {
        this.id = nextCarId++;
        this.laneIndex = laneIndex;
        this.direction = direction;
        this.sprite = sprite || pickVehicleSprite();
        this.x = 0;
        this.y = laneCenters[laneIndex] || 0;
        this.startY = this.y;
        this.targetY = this.y;
        this.width = 0;
        this.height = 0;
        this.baseSpeed = (132 + Math.random() * 58) * this.sprite.speedBias;
        this.laneChangeProgress = 0;
        this.isChangingLane = false;
        this.resize();
        this.x = direction > 0 ? -this.width - 24 : viewWidth + 24;
      }

      resize() {
        const dims = getVehicleRenderSize(this.sprite);
        this.width = dims.width;
        this.height = dims.height;
      }

      update(dt) {
        const speed = this.baseSpeed * baseSpeedMultiplier * difficultyScale;
        this.x += this.direction * speed * dt;

        if (this.isChangingLane) {
          const laneChangeSpeed = 7.8;
          this.laneChangeProgress = Math.min(1, this.laneChangeProgress + laneChangeSpeed * dt);
          const t = easeOutCubic(this.laneChangeProgress);
          this.y = this.startY + (this.targetY - this.startY) * t;

          if (this.laneChangeProgress >= 1) {
            this.isChangingLane = false;
            this.y = this.targetY;
            this.startY = this.targetY;
          }
        }
      }

      requestLaneChange(offset) {
        const newLane = this.laneIndex + offset;
        if (newLane < 0 || newLane >= LANES) return false;

        this.laneIndex = newLane;
        this.startY = this.y;
        this.targetY = laneCenters[newLane];
        this.laneChangeProgress = 0;
        this.isChangingLane = true;
        playSwipeSound();
        return true;
      }

      isOffscreen() {
        return (this.direction > 0 && this.x > viewWidth + this.width + 42) ||
          (this.direction < 0 && this.x < -this.width - 42);
      }

      draw(g, isSelected) {
        const x = this.x;
        const y = this.y - this.height / 2;
        const w = this.width;
        const h = this.height;
        const centerX = x + w / 2;
        const centerY = this.y;

        if (this.isChangingLane) {
          g.save();
          g.strokeStyle = 'rgba(250, 204, 21, 0.42)';
          g.lineWidth = 4;
          g.setLineDash([8, 8]);
          g.beginPath();
          g.moveTo(centerX, this.startY);
          g.lineTo(centerX, this.targetY);
          g.stroke();
          g.restore();
        }

        g.save();
        const shadowHeight = Math.max(8, h * 0.16);
        const shadowY = y + h * 0.8;
        const shadowGradient = g.createRadialGradient(centerX, shadowY, 2, centerX, shadowY, w * 0.5);
        shadowGradient.addColorStop(0, 'rgba(0, 0, 0, 0.34)');
        shadowGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
        g.fillStyle = shadowGradient;
        g.beginPath();
        g.ellipse(centerX, shadowY, w * 0.48, shadowHeight, 0, 0, Math.PI * 2);
        g.fill();
        g.restore();

        if (isSelected) {
          g.save();
          g.strokeStyle = 'rgba(250, 204, 21, 0.95)';
          g.lineWidth = 4;
          roundRect(g, x - 8, y - 8, w + 16, h + 16, 12);
          g.stroke();
          g.restore();
        }

        if (!vehicleSpriteReady) {
          drawFallbackVehicle(g, x, y, w, h, this.direction);
          return;
        }

        const frame = Math.floor((gameTime * 10 + this.id) % VEHICLE_FRAME_COUNT);
        const sourceX = frame * VEHICLE_FRAME_WIDTH +
          Math.floor((VEHICLE_FRAME_WIDTH - this.sprite.sourceWidth) / 2);
        const sourceY = this.sprite.row * VEHICLE_FRAME_HEIGHT +
          Math.floor((VEHICLE_FRAME_HEIGHT - this.sprite.sourceHeight) / 2) +
          VEHICLE_FRAME_BOB[frame];

        g.save();
        g.translate(centerX, centerY);
        if (this.direction < 0) {
          g.scale(-1, 1);
        }
        g.drawImage(
          vehicleSpriteImage,
          sourceX,
          sourceY,
          this.sprite.sourceWidth,
          this.sprite.sourceHeight,
          -w / 2,
          -h / 2,
          w,
          h
        );
        g.restore();
      }

      getHitbox() {
        const shrinkX = this.width * 0.16;
        const shrinkY = this.height * 0.28;
        return {
          x: this.x + shrinkX * 0.5,
          y: this.y - this.height / 2 + shrinkY * 0.5,
          width: this.width - shrinkX,
          height: this.height - shrinkY
        };
      }
    }

    class Particle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = 80 + Math.random() * 190;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 0.38 + Math.random() * 0.34;
        this.age = 0;
        this.size = 3 + Math.random() * 5;
        this.color = Math.random() < 0.4 ? 'rgba(248,250,252,1)'
          : (Math.random() < 0.5 ? 'rgba(248,113,113,1)' : 'rgba(251,191,36,1)');
      }

      update(dt) {
        this.age += dt;
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.vy += 280 * dt;
      }

      isDead() {
        return this.age >= this.life;
      }

      draw(g) {
        const t = this.age / this.life;
        g.save();
        g.globalAlpha = Math.max(0, 1 - t);
        g.fillStyle = this.color;
        g.beginPath();
        g.arc(this.x, this.y, this.size * (1 - t * 0.45), 0, Math.PI * 2);
        g.fill();
        g.restore();
      }
    }

    class FloatingText {
      constructor(text, x, y, color) {
        this.text = text;
        this.x = x;
        this.y = y;
        this.color = color;
        this.age = 0;
        this.life = 0.82;
      }

      update(dt) {
        this.age += dt;
        this.y -= 34 * dt;
      }

      isDead() {
        return this.age >= this.life;
      }

      draw(g) {
        const alpha = Math.max(0, 1 - this.age / this.life);
        g.save();
        g.globalAlpha = alpha;
        g.font = '700 15px system-ui, sans-serif';
        g.textAlign = 'center';
        g.textBaseline = 'middle';
        g.lineWidth = 4;
        g.strokeStyle = 'rgba(0, 0, 0, 0.55)';
        g.strokeText(this.text, this.x, this.y);
        g.fillStyle = this.color;
        g.fillText(this.text, this.x, this.y);
        g.restore();
      }
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function roundRect(g, x, y, w, h, r) {
      const minR = Math.min(r, w / 2, h / 2);
      g.beginPath();
      g.moveTo(x + minR, y);
      g.lineTo(x + w - minR, y);
      g.quadraticCurveTo(x + w, y, x + w, y + minR);
      g.lineTo(x + w, y + h - minR);
      g.quadraticCurveTo(x + w, y + h, x + w - minR, y + h);
      g.lineTo(x + minR, y + h);
      g.quadraticCurveTo(x, y + h, x, y + h - minR);
      g.lineTo(x, y + minR);
      g.quadraticCurveTo(x, y, x + minR, y);
      g.closePath();
    }

    function drawFallbackVehicle(g, x, y, w, h, direction) {
      g.save();
      roundRect(g, x, y, w, h, 10);
      g.fillStyle = '#38bdf8';
      g.fill();
      g.lineWidth = 2;
      g.strokeStyle = 'rgba(255, 255, 255, 0.45)';
      g.stroke();
      g.fillStyle = '#e0f2fe';
      roundRect(g, x + w * 0.24, y + h * 0.22, w * 0.42, h * 0.28, 5);
      g.fill();
      g.fillStyle = direction > 0 ? '#fde68a' : '#fecaca';
      roundRect(g, direction > 0 ? x + w * 0.84 : x + w * 0.08, y + h * 0.38, w * 0.08, h * 0.2, 4);
      g.fill();
      g.restore();
    }

    function getDifficultyCurve(points) {
      if (points < 10) {
        return {
          stage: '入門',
          speed: 1 + points * 0.012,
          interval: 1.46 - points * 0.016,
          lead: 1.18,
          maxCars: 4,
          maxConflicts: 1,
          reactionTime: 5.2
        };
      }
      if (points < 30) {
        const t = points - 10;
        return {
          stage: '進階',
          speed: 1.1 + t * 0.014,
          interval: 1.28 - t * 0.008,
          lead: 1.08,
          maxCars: 5,
          maxConflicts: 1,
          reactionTime: 4.9
        };
      }
      const t = points - 30;
      return {
        stage: '高壓',
        speed: Math.min(1.86, 1.38 + t * 0.008),
        interval: Math.max(0.86, 1.06 - t * 0.003),
        lead: 0.98,
        maxCars: 6,
        maxConflicts: 2,
        reactionTime: 4.5
      };
    }

    function applyDifficulty() {
      const curve = getDifficultyCurve(score);
      const oldStage = currentStage;
      currentStage = curve.stage;
      difficultyScale = curve.speed;
      spawnInterval = curve.interval;
      spawnLeadTime = curve.lead;
      maxCars = curve.maxCars;
      maxActiveConflicts = curve.maxConflicts;
      minSpawnReactionTime = curve.reactionTime;

      if (gameState === 'playing' && oldStage !== currentStage) {
        floatingTexts.push(new FloatingText(currentStage, viewWidth / 2, viewHeight * 0.18, '#67e8f9'));
      }
      updateHud();
    }

    function getSpawnX(direction, sprite = null) {
      const width = sprite ? getVehicleRenderSize(sprite).width : 80;
      return direction > 0 ? -width - 24 : viewWidth + 24;
    }

    function getCurrentCarSpeed(car) {
      return car.baseSpeed * baseSpeedMultiplier * difficultyScale;
    }

    function estimateSpriteSpeed(sprite) {
      return 160 * sprite.speedBias * baseSpeedMultiplier * difficultyScale;
    }

    function getHeadOnTime(aX, aWidth, aDirection, aSpeed, bX, bWidth, bDirection, bSpeed) {
      if (aDirection === bDirection) return Infinity;
      if (aDirection > 0 && bDirection < 0) {
        const gap = bX - (aX + aWidth);
        return gap <= 0 ? 0 : gap / (aSpeed + bSpeed);
      }
      if (aDirection < 0 && bDirection > 0) {
        const gap = aX - (bX + bWidth);
        return gap <= 0 ? 0 : gap / (aSpeed + bSpeed);
      }
      return Infinity;
    }

    function getCandidateConflicts(laneIndex, direction, sprite) {
      const spawnX = getSpawnX(direction, sprite);
      const candidateSize = getVehicleRenderSize(sprite);
      const candidateSpeed = estimateSpriteSpeed(sprite);
      const conflicts = [];

      for (let car of cars) {
        if (car.laneIndex !== laneIndex || car.direction === direction) continue;
        const time = getHeadOnTime(
          spawnX,
          candidateSize.width,
          direction,
          candidateSpeed,
          car.x,
          car.width,
          car.direction,
          getCurrentCarSpeed(car)
        );
        if (Number.isFinite(time) && time >= 0) {
          const meetingX = spawnX + candidateSize.width / 2 + direction * candidateSpeed * time;
          conflicts.push({ car, time, meetingX });
        }
      }

      return conflicts;
    }

    function countActiveHeadOnConflicts() {
      let count = 0;
      for (let i = 0; i < cars.length; i++) {
        for (let j = i + 1; j < cars.length; j++) {
          const a = cars[i];
          const b = cars[j];
          if (a.laneIndex !== b.laneIndex || a.direction === b.direction) continue;
          const time = getHeadOnTime(
            a.x,
            a.width,
            a.direction,
            getCurrentCarSpeed(a),
            b.x,
            b.width,
            b.direction,
            getCurrentCarSpeed(b)
          );
          if (Number.isFinite(time) && time < 8.5) count++;
        }
      }
      return count;
    }

    function hasSafeEscapeLane(laneIndex, meetingX, conflictTime, candidateWidth) {
      const adjacentLanes = [laneIndex - 1, laneIndex + 1].filter(lane => lane >= 0 && lane < LANES);
      const checkTime = clamp(conflictTime * 0.55, 0.75, 3.2);
      const clearance = Math.max(120, candidateWidth * 0.95, viewWidth * 0.16);

      return adjacentLanes.some(adjacentLane => {
        if (spawnWarnings.some(w => w.laneIndex === adjacentLane)) return false;
        return !cars.some(car => {
          if (car.laneIndex !== adjacentLane) return false;
          const projectedCenter = car.x + car.width / 2 + car.direction * getCurrentCarSpeed(car) * checkTime;
          return Math.abs(projectedCenter - meetingX) < clearance + car.width * 0.35;
        });
      });
    }

    function canSpawnCar(laneIndex, direction, ignoreQueuedWarning = false, sprite = null) {
      const candidateSprite = sprite || VEHICLE_SPRITES[0];
      const spawnX = getSpawnX(direction, candidateSprite);
      const candidateSize = getVehicleRenderSize(candidateSprite);
      const minSameDirectionDist = Math.max(170, viewWidth * 0.36);

      for (let car of cars) {
        if (car.laneIndex !== laneIndex) continue;

        const distance = Math.abs(car.x - spawnX);
        if (car.direction === direction && distance < minSameDirectionDist) {
          return false;
        }
      }

      if (!ignoreQueuedWarning && spawnWarnings.some(w => w.laneIndex === laneIndex)) {
        return false;
      }

      const conflicts = getCandidateConflicts(laneIndex, direction, candidateSprite);
      if (conflicts.some(conflict => conflict.time < minSpawnReactionTime)) {
        return false;
      }

      const activeConflicts = countActiveHeadOnConflicts();
      if (conflicts.length > 0 && activeConflicts + conflicts.length > maxActiveConflicts) {
        return false;
      }

      if (conflicts.some(conflict =>
        conflict.time < 10 &&
        !hasSafeEscapeLane(laneIndex, conflict.meetingX, conflict.time, candidateSize.width)
      )) {
        return false;
      }

      return true;
    }

    function queueSpawnWarning() {
      if (cars.length + spawnWarnings.length >= maxCars) return;
      const maxWarnings = score < 30 ? 1 : 2;
      if (spawnWarnings.length >= maxWarnings) return;

      const candidates = [];
      for (let attempt = 0; attempt < 36; attempt++) {
        const direction = Math.random() < 0.5 ? 1 : -1;
        const laneIndex = Math.floor(Math.random() * LANES);
        const sprite = pickVehicleSprite();
        if (canSpawnCar(laneIndex, direction, false, sprite)) {
          const laneLoad = cars.filter(car => car.laneIndex === laneIndex).length;
          const conflicts = getCandidateConflicts(laneIndex, direction, sprite).length;
          const candidateScore = laneLoad * 18 + conflicts * 12 + Math.random() * 10;
          candidates.push({ laneIndex, direction, sprite, candidateScore });
        }
      }

      if (!candidates.length) return;
      candidates.sort((a, b) => a.candidateScore - b.candidateScore);
      const chosen = candidates[0];
      spawnWarnings.push({
        laneIndex: chosen.laneIndex,
        direction: chosen.direction,
        sprite: chosen.sprite,
        age: 0,
        duration: spawnLeadTime
      });
    }

    function spawnCar(laneIndex, direction, ignoreQueuedWarning = false, sprite = null) {
      const candidateSprite = sprite || pickVehicleSprite();
      if (!canSpawnCar(laneIndex, direction, ignoreQueuedWarning, candidateSprite)) return false;
      cars.push(new Car(laneIndex, direction, candidateSprite));
      playVehicleSpawnSound(candidateSprite, direction);
      return true;
    }

    function updateSpawnWarnings(dt) {
      const remaining = [];
      for (let warning of spawnWarnings) {
        warning.age += dt;
        if (warning.age >= warning.duration) {
          if (!spawnCar(warning.laneIndex, warning.direction, true, warning.sprite)) {
            warning.age = warning.duration * 0.55;
            remaining.push(warning);
          }
        } else {
          remaining.push(warning);
        }
      }
      spawnWarnings = remaining;
    }

    function addScore(points, label, x, y, color) {
      score += points;
      if (score > bestScore) {
        bestScore = score;
        writeBestScore(bestScore);
      }
      if (label) {
        floatingTexts.push(new FloatingText(label, clamp(x, 40, viewWidth - 40), y, color));
      }
      applyDifficulty();
    }

    function handleCarPassed(car) {
      combo++;
      comboMultiplier = combo >= 12 ? 3 : (combo >= 5 ? 2 : 1);
      addScore(comboMultiplier, `+${comboMultiplier}`, car.x, car.y, '#86efac');
      if (combo === 5 || combo === 12) {
        floatingTexts.push(new FloatingText(`Combo x${comboMultiplier}`, viewWidth / 2, car.y, '#fbbf24'));
      }
      playPassSound();
    }

    function checkNearMisses() {
      for (let i = 0; i < cars.length; i++) {
        for (let j = i + 1; j < cars.length; j++) {
          const a = cars[i];
          const b = cars[j];
          if (a.direction === b.direction) continue;

          const pairId = a.id < b.id ? `${a.id}:${b.id}` : `${b.id}:${a.id}`;
          if (nearMissPairs.has(pairId)) continue;

          const ha = a.getHitbox();
          const hb = b.getHitbox();
          const horizontalOverlap = ha.x < hb.x + hb.width && ha.x + ha.width > hb.x;
          const centerGapY = Math.abs((ha.y + ha.height / 2) - (hb.y + hb.height / 2));
          const notColliding = !rectsOverlap(ha, hb);

          if (horizontalOverlap && notColliding && centerGapY < laneHeight * 1.08) {
            nearMissPairs.add(pairId);
            nearMissCount++;
            combo += 2;
            comboMultiplier = combo >= 12 ? 3 : (combo >= 5 ? 2 : 1);
            addScore(2, '擦身 +2', (a.x + b.x) / 2, (a.y + b.y) / 2, '#fdba74');
            playNearMissSound();
          }
        }
      }
    }

    function rectsOverlap(a, b) {
      return a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y;
    }

    function checkCollisions() {
      for (let i = 0; i < cars.length; i++) {
        for (let j = i + 1; j < cars.length; j++) {
          const a = cars[i];
          const b = cars[j];
          const ha = a.getHitbox();
          const hb = b.getHitbox();

          if (rectsOverlap(ha, hb)) {
            triggerCrash((ha.x + hb.x + hb.width) / 2, (ha.y + hb.y + hb.height) / 2);
            return true;
          }
        }
      }
      return false;
    }

    function setEndGameButtonVisible(isVisible) {
      endGameBtn.classList.toggle('hidden', !isVisible);
    }

    function showRunSummary(title, message, titleColor) {
      gameOverTitle.textContent = title;
      gameOverTitle.style.color = titleColor;
      gameOverMessage.textContent = message;
      finalScoreLabel.textContent = String(score);
      finalBestScoreLabel.textContent = String(bestScore);
      finalNearMissLabel.textContent = String(nearMissCount);
      updateHud();
      setEndGameButtonVisible(false);
      gameOverOverlay.classList.remove('hidden');
    }

    function finishRun(reason, title, message, titleColor) {
      gameState = 'gameover';
      gameEndReason = reason;
      activePointerId = null;
      activeCar = null;
      selectedCar = null;
      combo = 0;
      comboMultiplier = 1;

      showRunSummary(title, message, titleColor);
    }

    function triggerCrash(x, y) {
      for (let i = 0; i < 48; i++) {
        particles.push(new Particle(x, y));
      }

      screenShakeTime = 0.45;
      screenShakeIntensity = 11;
      playCrashSound();

      finishRun(
        'crash',
        '💥 撞車了！',
        '小小交管員辛苦了，再挑戰一次吧。',
        '#fca5a5'
      );
    }

    function endCurrentGame() {
      if (gameState !== 'playing') return;

      spawnWarnings = [];
      playManualEndSound();
      finishRun(
        'manual',
        '■ 已結束遊戲',
        '本次分數已保留，可以再玩一次或回設定調整車速。',
        '#fde68a'
      );
      render();
    }

    function resetGame() {
      cars = [];
      particles = [];
      spawnWarnings = [];
      floatingTexts = [];
      nearMissPairs = new Set();
      spawnTimer = 0;
      score = 0;
      combo = 0;
      comboMultiplier = 1;
      nearMissCount = 0;
      selectedCar = null;
      activePointerId = null;
      activeCar = null;
      gameTime = 0;
      gameEndReason = null;
      screenShakeTime = 0;
      screenShakeIntensity = 0;
      currentStage = '入門';
      applyDifficulty();
      updateHud();
      setEndGameButtonVisible(false);
    }

    function startGame() {
      ensureAudioContext();
      resetGame();
      baseSpeedMultiplier = parseFloat(speedSlider.value) || 1.0;
      menuOverlay.classList.add('hidden');
      gameOverOverlay.classList.add('hidden');
      gameState = 'playing';
      setEndGameButtonVisible(true);
    }

    function backToMenu() {
      resetGame();
      gameState = 'menu';
      gameOverOverlay.classList.add('hidden');
      menuOverlay.classList.remove('hidden');
    }

    speedSlider.addEventListener('input', function () {
      speedDisplay.textContent = parseFloat(speedSlider.value).toFixed(1) + 'x';
    });

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);
    backToMenuBtn.addEventListener('click', backToMenu);
    endGameBtn.addEventListener('click', endCurrentGame);

    let activePointerId = null;
    let activeCar = null;
    let lastPointerY = 0;

    function getCanvasPoint(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function findCarAt(x, y) {
      for (let i = cars.length - 1; i >= 0; i--) {
        const car = cars[i];
        const hb = car.getHitbox();
        const expand = Math.max(12, laneHeight * 0.08);
        if (
          x >= hb.x - expand &&
          x <= hb.x + hb.width + expand &&
          y >= hb.y - expand &&
          y <= hb.y + hb.height + expand
        ) {
          return car;
        }
      }
      return null;
    }

    function selectCar(car) {
      selectedCar = car && cars.includes(car) ? car : null;
    }

    function cycleSelectedCar(direction) {
      if (!cars.length) {
        selectedCar = null;
        return;
      }

      const orderedCars = [...cars].sort((a, b) => a.x - b.x);
      let index = selectedCar ? orderedCars.indexOf(selectedCar) : -1;
      index = (index + direction + orderedCars.length) % orderedCars.length;
      selectedCar = orderedCars[index];
    }

    function ensureSelectedCar() {
      if (selectedCar && cars.includes(selectedCar)) return selectedCar;
      if (!cars.length) return null;
      const centerX = viewWidth / 2;
      selectedCar = [...cars].sort((a, b) => Math.abs(a.x - centerX) - Math.abs(b.x - centerX))[0];
      return selectedCar;
    }

    function handlePointerDown(id, clientX, clientY) {
      if (gameState !== 'playing') return;
      if (activePointerId !== null) return;

      const p = getCanvasPoint(clientX, clientY);
      const car = findCarAt(p.x, p.y);
      if (car) {
        activePointerId = id;
        activeCar = car;
        selectedCar = car;
        lastPointerY = p.y;
      }
    }

    function handlePointerMove(id, clientX, clientY) {
      if (gameState !== 'playing') return;
      if (activePointerId !== id) return;
      if (!activeCar) return;

      const p = getCanvasPoint(clientX, clientY);
      const dy = p.y - lastPointerY;
      const threshold = laneHeight * 0.28;

      if (Math.abs(dy) > threshold) {
        const offset = dy < 0 ? -1 : 1;
        const changed = activeCar.requestLaneChange(offset);
        if (changed) {
          lastPointerY = p.y;
        }
      }
    }

    function clearPointer(id) {
      if (activePointerId === id) {
        activePointerId = null;
        activeCar = null;
      }
    }

    canvas.addEventListener('mousedown', function (e) {
      ensureAudioContext();
      handlePointerDown('mouse', e.clientX, e.clientY);
    });

    window.addEventListener('mousemove', function (e) {
      handlePointerMove('mouse', e.clientX, e.clientY);
    });

    window.addEventListener('mouseup', function () {
      clearPointer('mouse');
    });

    canvas.addEventListener('touchstart', function (e) {
      ensureAudioContext();
      e.preventDefault();
      const touch = e.changedTouches[0];
      if (!touch) return;
      handlePointerDown(touch.identifier, touch.clientX, touch.clientY);
    }, { passive: false });

    canvas.addEventListener('touchmove', function (e) {
      e.preventDefault();
      const touchList = e.changedTouches;
      for (let i = 0; i < touchList.length; i++) {
        const touch = touchList[i];
        handlePointerMove(touch.identifier, touch.clientX, touch.clientY);
      }
    }, { passive: false });

    canvas.addEventListener('touchend', function (e) {
      e.preventDefault();
      const touchList = e.changedTouches;
      for (let i = 0; i < touchList.length; i++) {
        clearPointer(touchList[i].identifier);
      }
    }, { passive: false });

    canvas.addEventListener('touchcancel', function (e) {
      e.preventDefault();
      const touchList = e.changedTouches;
      for (let i = 0; i < touchList.length; i++) {
        clearPointer(touchList[i].identifier);
      }
    }, { passive: false });

    window.addEventListener('keydown', function (e) {
      if (e.key === 'f' || e.key === 'F') {
        e.preventDefault();
        toggleFullscreen();
        return;
      }

      if (gameState !== 'playing') return;

      if (e.key === 'Tab') {
        e.preventDefault();
        cycleSelectedCar(e.shiftKey ? -1 : 1);
        return;
      }

      const key = e.key.toLowerCase();
      if (key === 'arrowup' || key === 'w' || key === 'arrowdown' || key === 's') {
        e.preventDefault();
        const car = ensureSelectedCar();
        if (!car) return;
        car.requestLaneChange(key === 'arrowup' || key === 'w' ? -1 : 1);
      }
    });

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        if (gameFrame.requestFullscreen) {
          gameFrame.requestFullscreen();
        }
      } else if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }

    function gameLoop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const dt = Math.min(0.035, (timestamp - lastTime) / 1000);
      lastTime = timestamp;

      update(dt);
      render();

      requestAnimationFrame(gameLoop);
    }

    function update(dt) {
      gameTime += dt;
      particles.forEach(p => p.update(dt));
      particles = particles.filter(p => !p.isDead());
      floatingTexts.forEach(t => t.update(dt));
      floatingTexts = floatingTexts.filter(t => !t.isDead());

      if (screenShakeTime > 0) {
        screenShakeTime = Math.max(0, screenShakeTime - dt);
      }

      if (gameState !== 'playing') return;

      applyDifficulty();
      updateSpawnWarnings(dt);

      spawnTimer += dt;
      if (spawnTimer >= spawnInterval) {
        spawnTimer = 0;
        queueSpawnWarning();
      }

      for (let car of cars) {
        car.update(dt);
      }

      const remainedCars = [];
      for (let car of cars) {
        if (car.isOffscreen()) {
          handleCarPassed(car);
        } else {
          remainedCars.push(car);
        }
      }
      cars = remainedCars;

      if (selectedCar && !cars.includes(selectedCar)) {
        selectedCar = null;
      }

      checkNearMisses();
      checkCollisions();
    }

    function renderBackground() {
      const g = ctx;
      g.save();

      const bg = g.createLinearGradient(0, 0, 0, viewHeight);
      bg.addColorStop(0, '#17251d');
      bg.addColorStop(0.18, '#1f2a22');
      bg.addColorStop(0.5, '#222824');
      bg.addColorStop(0.82, '#1e2728');
      bg.addColorStop(1, '#13251f');
      g.fillStyle = bg;
      g.fillRect(0, 0, viewWidth, viewHeight);

      for (let i = 0; i < LANES; i++) {
        const y = laneTops[i];
        const laneGradient = g.createLinearGradient(0, y, 0, y + laneHeight);
        laneGradient.addColorStop(0, i === 1 ? '#29302d' : '#242b27');
        laneGradient.addColorStop(1, i === 1 ? '#202823' : '#1d2420');
        g.fillStyle = laneGradient;
        g.fillRect(0, y, viewWidth, laneHeight);

        g.fillStyle = 'rgba(255, 255, 255, 0.025)';
        for (let x = -40; x < viewWidth; x += 96) {
          g.fillRect(x, y + laneHeight * 0.16, 28, laneHeight * 0.68);
        }
      }

      for (let i = 1; i < LANES; i++) {
        const y = laneHeight * i;
        g.strokeStyle = 'rgba(250, 204, 21, 0.52)';
        g.lineWidth = 4;
        g.setLineDash([24, 18]);
        g.beginPath();
        g.moveTo(0, y);
        g.lineTo(viewWidth, y);
        g.stroke();
      }
      g.setLineDash([]);

      g.strokeStyle = 'rgba(34, 197, 94, 0.38)';
      g.lineWidth = 8;
      g.beginPath();
      g.moveTo(0, 3);
      g.lineTo(viewWidth, 3);
      g.moveTo(0, viewHeight - 3);
      g.lineTo(viewWidth, viewHeight - 3);
      g.stroke();

      g.restore();
    }

    function renderSpawnWarnings() {
      const g = ctx;
      for (let warning of spawnWarnings) {
        const progress = warning.age / warning.duration;
        const pulse = 0.5 + Math.sin(progress * Math.PI * 8) * 0.5;
        const laneTop = laneTops[warning.laneIndex];
        const y = laneCenters[warning.laneIndex];
        const edgeX = warning.direction > 0 ? 0 : viewWidth;
        const arrowX = warning.direction > 0 ? 30 : viewWidth - 30;
        const sign = warning.direction > 0 ? 1 : -1;

        g.save();
        g.fillStyle = `rgba(248, 113, 113, ${0.16 + pulse * 0.14})`;
        g.fillRect(0, laneTop, viewWidth, laneHeight);

        const edgeGlow = g.createLinearGradient(edgeX, 0, edgeX + sign * 140, 0);
        edgeGlow.addColorStop(0, `rgba(248, 113, 113, ${0.72 + pulse * 0.24})`);
        edgeGlow.addColorStop(1, 'rgba(248, 113, 113, 0)');
        g.fillStyle = edgeGlow;
        g.fillRect(warning.direction > 0 ? 0 : viewWidth - 140, laneTop, 140, laneHeight);

        g.fillStyle = `rgba(254, 226, 226, ${0.75 + pulse * 0.25})`;
        for (let i = 0; i < 3; i++) {
          const x = arrowX + sign * i * 18;
          g.beginPath();
          g.moveTo(x + sign * 13, y);
          g.lineTo(x - sign * 4, y - 15);
          g.lineTo(x - sign * 4, y + 15);
          g.closePath();
          g.fill();
        }
        g.restore();
      }
    }

    function render() {
      if (!viewWidth || !viewHeight) return;

      ctx.clearRect(0, 0, viewWidth, viewHeight);
      ctx.save();

      if (screenShakeTime > 0) {
        const shakeProgress = screenShakeTime / 0.45;
        const mag = screenShakeIntensity * shakeProgress;
        ctx.translate((Math.random() * 2 - 1) * mag, (Math.random() * 2 - 1) * mag);
      }

      renderBackground();
      renderSpawnWarnings();

      for (let car of cars) {
        car.draw(ctx, car === selectedCar);
      }

      for (let particle of particles) {
        particle.draw(ctx);
      }

      for (let text of floatingTexts) {
        text.draw(ctx);
      }

      ctx.restore();
    }

    function renderGameToText() {
      return JSON.stringify({
        coordinateSystem: 'canvas pixels, origin top-left, x right, y down',
        state: gameState,
        endReason: gameEndReason,
        endButtonVisible: !endGameBtn.classList.contains('hidden'),
        audioEnabled,
        score,
        bestScore,
        combo,
        comboMultiplier,
        nearMissCount,
        stage: currentStage,
        lanes: laneCenters.map((center, index) => ({ index, centerY: Math.round(center) })),
        selectedCarId: selectedCar ? selectedCar.id : null,
        cars: cars.map(car => ({
          id: car.id,
          sprite: car.sprite.name,
          laneIndex: car.laneIndex,
          direction: car.direction > 0 ? 'right' : 'left',
          x: Math.round(car.x),
          y: Math.round(car.y),
          changingLane: car.isChangingLane
        })),
        warnings: spawnWarnings.map(w => ({
          laneIndex: w.laneIndex,
          direction: w.direction > 0 ? 'right' : 'left',
          sprite: w.sprite ? w.sprite.name : null,
          remainingMs: Math.max(0, Math.round((w.duration - w.age) * 1000))
        })),
        safety: {
          activeHeadOnConflicts: countActiveHeadOnConflicts(),
          maxActiveConflicts,
          minSpawnReactionTime
        }
      });
    }

    window.render_game_to_text = renderGameToText;
    window.advanceTime = function (ms) {
      const steps = Math.max(1, Math.round(ms / (1000 / 60)));
      for (let i = 0; i < steps; i++) {
        update(1 / 60);
      }
      render();
    };

    updateHud();
    resizeCanvas();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
